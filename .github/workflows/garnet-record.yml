name: Dependency install and test (recorded)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'rb/**'

concurrency:
  group: record-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  install-test:
    name: Install and test (recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # OIDC exchange; no token to configure.
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1
        with:
          filename: '.tool-versions'
          uppercase: 'true'
          prefix: 'tool_version_'

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '${{ env.TOOL_VERSION_UV }}'
          python-version: '${{ env.TOOL_VERSION_PYTHON }}'
          enable-cache: true

      - name: Install dependencies (lifecycle scripts execute here)
        run: uv sync --locked
        working-directory: chart_data_extractor

      - name: Test
        continue-on-error: true
        run: uv build && uv run pytest --verbose -x
        working-directory: chart_data_extractor

      - name: Let sensor settle
        if: always()
        run: sleep 30
